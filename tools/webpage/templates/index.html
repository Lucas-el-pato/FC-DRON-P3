<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC TELEMETRY</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Cursor-style dark high contrast */
    :root,
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --panel: #000000;
      --panel-2: #0b0b0d;
      --border: #3a3a3f;
      --border-bright: #6e6e76;
      --text: #ffffff;
      --label: #a8aab0;
      --accent: #7dd3fc;
      --accent-strong: #bae6fd;
      --accent-dim: rgba(125, 211, 252, 0.18);
      --accent-press: rgba(125, 211, 252, 0.3);
      --ok: #4ade80;
      --warn: #fbbf24;
      --fail: #ff5c5c;
      --grid: #2a2a2e;
      --input-bg: #000000;
      --chart-grid: #2a2a2e;
      --chart-tick: #a8aab0;
      --chart-legend: #e6e6ea;
      --compass-bg-a: #0b0b0d;
      --compass-bg-b: #17171a;
      --compass-tick: rgba(255, 255, 255, 0.16);
      --compass-needle: #ffffff;
      --body-tint: rgba(56, 96, 130, 0.12);
      --body-line: rgba(255, 255, 255, 0.02);
      --header-a: rgba(14, 14, 16, 0.96);
      --header-b: rgba(0, 0, 0, 0.96);
      --cell-bg: rgba(255, 255, 255, 0.03);
      --line-1: #ffffff;
      --line-2: #9ca3af;
      --line-3: #6b7280;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f4f5f7;
      --border: #c3c7cd;
      --border-bright: #8a9099;
      --text: #0b0d10;
      --label: #4a5058;
      --accent: #0369a1;
      --accent-strong: #075985;
      --accent-dim: rgba(3, 105, 161, 0.12);
      --accent-press: rgba(3, 105, 161, 0.22);
      --ok: #15803d;
      --warn: #b45309;
      --fail: #b91c1c;
      --grid: #dfe2e6;
      --input-bg: #ffffff;
      --chart-grid: #dfe2e6;
      --chart-tick: #4a5058;
      --chart-legend: #23272d;
      --compass-bg-a: #ffffff;
      --compass-bg-b: #e8eaee;
      --compass-tick: rgba(0, 0, 0, 0.16);
      --compass-needle: #0b0d10;
      --body-tint: rgba(3, 105, 161, 0.07);
      --body-line: rgba(0, 0, 0, 0.035);
      --header-a: rgba(255, 255, 255, 0.97);
      --header-b: rgba(242, 243, 245, 0.97);
      --cell-bg: rgba(0, 0, 0, 0.025);
      --line-1: #111827;
      --line-2: #6b7280;
      --line-3: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
      background:
        radial-gradient(1200px 500px at 70% -10%, var(--body-tint) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent 0 31px, var(--body-line) 31px 32px),
        repeating-linear-gradient(90deg, transparent 0 31px, var(--body-line) 31px 32px),
        var(--bg);
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border: 2px solid var(--bg);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, var(--header-a) 0%, var(--header-b) 100%);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 0.6rem;
      background: var(--accent);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      vertical-align: 1px;
    }

    .status {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
      font-size: 10px;
      color: var(--label);
      flex-wrap: wrap;
    }

    .status > span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid var(--border);
      background: var(--panel-2);
      padding: 0.3rem 0.6rem;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #connText {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fail);
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--fail);
      animation: dot-pulse 1.6s ease-in-out infinite;
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: none;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    main {
      padding: 0.75rem;
      display: grid;
      gap: 0.75rem;
      grid-template-columns: minmax(280px, 340px) 1fr;
      grid-template-areas:
        "attitude charts-top"
        "attitude charts-bottom";
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-areas:
          "attitude"
          "charts-top"
          "charts-bottom";
      }
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--border);
      padding: 0.85rem;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    /* HUD corner brackets */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }

    .card::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid var(--accent);
      border-left: 1px solid var(--accent);
      opacity: 0.55;
    }

    .card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 1px solid var(--accent);
      border-right: 1px solid var(--accent);
      opacity: 0.55;
    }

    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .card h2::before {
      content: "// ";
      color: var(--accent);
      opacity: 0.7;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .card-header h2 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .chart-toggle-btn {
      flex-shrink: 0;
      min-width: 5.5rem;
      white-space: nowrap;
    }

    .chart-toggle-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .chart-wrap {
      display: none;
    }

    .chart-wrap.visible {
      display: block;
    }

    .attitude-card {
      grid-area: attitude;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .charts-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .charts-top { grid-area: charts-top; }
    .charts-bottom { grid-area: charts-bottom; }

    .values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      font-size: 11px;
      margin-bottom: 0.75rem;
    }

    .value-cell {
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-bright);
      background: var(--cell-bg);
      padding: 0.35rem 0.5rem;
      min-width: 0;
    }

    .value-cell span {
      display: block;
      color: var(--label);
      font-size: 10px;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .value-cell strong {
      font-weight: 400;
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    canvas {
      width: 100% !important;
      height: 180px !important;
    }

    .connect-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    input {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.55rem;
      font-family: inherit;
      font-size: 11px;
      text-transform: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-dim), 0 0 12px var(--accent-dim);
    }

    button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    button:active {
      background: var(--accent-press);
    }

    #connectBtn {
      border-color: var(--border-bright);
      color: var(--accent);
    }

    /* Attitude indicator */
    .attitude-scene {
      flex: 1;
      position: relative;
      min-height: 300px;
      background: #000;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
      overflow: hidden;
      transition: background 0.25s ease;
    }

    .attitude-scene.light {
      background: #ffffff;
    }

    .attitude-scene.light::before {
      background:
        linear-gradient(#64748b, #64748b) left top / 14px 1px,
        linear-gradient(#64748b, #64748b) left top / 1px 14px,
        linear-gradient(#64748b, #64748b) right top / 14px 1px,
        linear-gradient(#64748b, #64748b) right top / 1px 14px,
        linear-gradient(#64748b, #64748b) left bottom / 14px 1px,
        linear-gradient(#64748b, #64748b) left bottom / 1px 14px,
        linear-gradient(#64748b, #64748b) right bottom / 14px 1px,
        linear-gradient(#64748b, #64748b) right bottom / 1px 14px;
      background-repeat: no-repeat;
    }

    .attitude-scene.light::after {
      color: #475569;
      opacity: 0.75;
    }

    #attitudeCanvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      z-index: 1;
    }

    /* HUD overlay on the 3D viewport */
    .attitude-scene::before {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(var(--accent), var(--accent)) left top / 14px 1px,
        linear-gradient(var(--accent), var(--accent)) left top / 1px 14px,
        linear-gradient(var(--accent), var(--accent)) right top / 14px 1px,
        linear-gradient(var(--accent), var(--accent)) right top / 1px 14px,
        linear-gradient(var(--accent), var(--accent)) left bottom / 14px 1px,
        linear-gradient(var(--accent), var(--accent)) left bottom / 1px 14px,
        linear-gradient(var(--accent), var(--accent)) right bottom / 14px 1px,
        linear-gradient(var(--accent), var(--accent)) right bottom / 1px 14px;
      background-repeat: no-repeat;
      opacity: 0.45;
    }

    .attitude-scene::after {
      content: "LIVE // 3D";
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 2;
      pointer-events: none;
      font-size: 8px;
      letter-spacing: 0.2em;
      color: var(--accent);
      opacity: 0.6;
    }

    .attitude-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .attitude-card-header h2 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    .vehicle-switch-btn {
      flex-shrink: 0;
      white-space: nowrap;
    }

    .vehicle-switch-btn::before {
      content: "→ ";
      color: var(--label);
    }

    .attitude-card-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .axis-invert-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .axis-invert-label {
      color: var(--label);
      font-size: 10px;
      margin-right: 0.15rem;
    }

    .axis-invert-btn {
      min-width: 2.25rem;
      padding: 0.25rem 0.45rem;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .axis-invert-btn.active,
    .attitude-filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .attitude-filter-btn {
      min-width: 5.5rem;
      white-space: nowrap;
    }

    .attitude-readout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .attitude-readout .value-cell {
      border-left-color: var(--accent);
      text-align: center;
      padding: 0.45rem 0.5rem;
    }

    .attitude-readout .value-cell strong {
      font-size: 20px;
      color: var(--accent);
      text-shadow: 0 0 14px var(--accent-dim);
    }

    .telemetry-tag {
      color: var(--label);
      font-size: 9px;
      letter-spacing: 0.1em;
      border-top: 1px dashed var(--border);
      padding-top: 0.6rem;
    }

    /* Magnetometer compass */
    .mag-header {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .mag-header .values {
      margin-bottom: 0;
    }

    .compass {
      position: relative;
      width: 88px;
      height: 88px;
      justify-self: end;
      flex-shrink: 0;
    }

    .compass-ring {
      position: absolute;
      inset: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from -90deg at 50% 50%,
          transparent 0deg 84deg,
          var(--compass-tick) 84deg 90deg
        ),
        radial-gradient(circle, var(--compass-bg-a) 0%, var(--compass-bg-b) 72%, var(--compass-bg-a) 100%);
      box-shadow: 0 0 0 1px var(--compass-tick) inset;
    }

    .compass-cardinal {
      position: absolute;
      font-size: 8px;
      line-height: 1;
      letter-spacing: 0.06em;
      color: var(--label);
      z-index: 1;
    }

    .compass-cardinal.n {
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--fail);
    }

    .compass-cardinal.e {
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-cardinal.s {
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass-cardinal.w {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .compass-heading-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 28px;
      margin-left: -1px;
      margin-top: -28px;
      background: linear-gradient(180deg, var(--compass-needle) 0%, transparent 100%);
      transform-origin: 50% 100%;
      transition: transform 0.1s linear;
      border-radius: 1px;
      z-index: 2;
    }

    .compass-heading-mark::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--compass-needle);
    }

    .compass-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--panel-2);
      z-index: 3;
    }

    .compass-hdg {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      text-align: center;
      font-size: 8px;
      color: var(--label);
      letter-spacing: 0.06em;
      z-index: 2;
      pointer-events: none;
    }

    .theme-toggle-btn {
      font-size: 10px;
      padding: 0.3rem 0.6rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      border-color: var(--border-bright);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>FC TELEMETRY</h1>
    <div class="connect-form">
      <input id="port" type="text" placeholder="/dev/ttyACM0">
      <input id="baud" type="number" value="115200" min="9600" step="9600">
      <button id="connectBtn" type="button">Connect</button>
    </div>
    <div class="status">
      <button id="themeToggle" class="theme-toggle-btn" type="button" aria-pressed="false">Theme: Dark HC</button>
      <span><span id="connDot" class="dot"></span><span id="connText">Offline</span></span>
      <span id="lineCount">PKT 0</span>
      <span id="lastUpdate">T+ --</span>
    </div>
  </header>

  <main>
    <section class="card attitude-card">
      <div class="attitude-card-header">
        <h2 id="attitudeTitle">Attitude // Starship Stack</h2>
        <div class="attitude-card-actions">
          <button id="vehicleSwitchBtn" class="vehicle-switch-btn" type="button">Quad</button>
        </div>
      </div>
      <div class="attitude-scene" id="attitudeScene">
        <canvas id="attitudeCanvas"></canvas>
      </div>
      <div class="attitude-readout">
        <div class="value-cell">
          <span>Pitch</span>
          <strong id="pitchValue">--</strong>
        </div>
        <div class="value-cell">
          <span>Roll</span>
          <strong id="rollValue">--</strong>
        </div>
        <div class="value-cell">
          <span>Yaw</span>
          <strong id="yawValue">--</strong>
        </div>
      </div>
      <div class="axis-invert-row">
        <span class="axis-invert-label">Invert axis</span>
        <button id="invertXBtn" class="axis-invert-btn" type="button" data-axis="x" aria-pressed="false">X</button>
        <button id="invertYBtn" class="axis-invert-btn" type="button" data-axis="y" aria-pressed="false">Y</button>
        <button id="invertZBtn" class="axis-invert-btn" type="button" data-axis="z" aria-pressed="false">Z</button>
        <button id="attitudeFilterBtn" class="attitude-filter-btn axis-invert-btn" type="button" aria-pressed="false">Filter: Raw</button>
      </div>
      <p class="telemetry-tag" id="attitudeSourceTag" style="margin: 0.75rem 0 0;">Pitch/roll from accelerometer, yaw from magnetometer (tilt-compensated)</p>
    </section>

    <div class="charts-top charts-grid">
      <section class="card">
        <h2>IMU Gyro Raw</h2>
        <div class="values" id="gyroValues"></div>
        <canvas id="gyroChart"></canvas>
      </section>
      <section class="card">
        <h2>IMU Accel Raw</h2>
        <div class="values" id="accelValues"></div>
        <canvas id="accelChart"></canvas>
      </section>
    </div>

    <div class="charts-bottom charts-grid">
      <section class="card">
        <div class="card-header">
          <h2>Barometer Raw</h2>
          <button id="baroChartToggle" class="axis-invert-btn chart-toggle-btn" type="button" aria-pressed="false">Chart: Off</button>
        </div>
        <div class="values" id="baroValues"></div>
        <div class="chart-wrap" id="baroChartWrap">
          <canvas id="baroChart"></canvas>
        </div>
      </section>
      <section class="card">
        <div class="card-header">
          <h2>Magnetometer Raw</h2>
          <button id="magChartToggle" class="axis-invert-btn chart-toggle-btn" type="button" aria-pressed="false">Chart: Off</button>
        </div>
        <div class="mag-header">
          <div class="values" id="magValues"></div>
          <div class="compass" id="magCompass" aria-label="Magnetic heading compass">
            <div class="compass-ring">
              <span class="compass-cardinal n">N</span>
              <span class="compass-cardinal e">E</span>
              <span class="compass-cardinal s">S</span>
              <span class="compass-cardinal w">W</span>
            </div>
            <div class="compass-heading-mark" id="compassHeadingMark"></div>
            <div class="compass-center"></div>
            <div class="compass-hdg" id="compassHdg">HDG --</div>
          </div>
        </div>
        <div class="chart-wrap" id="magChartWrap">
          <canvas id="magChart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    function cssVar(name, fallback) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    function buildChartTheme() {
      const tick = cssVar('--chart-tick', '#a8aab0');
      const grid = cssVar('--chart-grid', '#2a2a2e');
      const legend = cssVar('--chart-legend', '#e6e6ea');
      return {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: { color: tick, maxTicksLimit: 6, font: { family: 'system-ui, Segoe UI, Arial, sans-serif', size: 10 } },
            grid: { color: grid, lineWidth: 1 }
          },
          y: {
            ticks: { color: tick, font: { family: 'system-ui, Segoe UI, Arial, sans-serif', size: 10 } },
            grid: { color: grid, lineWidth: 1 }
          }
        },
        plugins: {
          legend: {
            labels: {
              color: legend,
              font: { family: 'system-ui, Segoe UI, Arial, sans-serif', size: 10 },
              boxWidth: 12,
              boxHeight: 1
            }
          }
        },
        elements: {
          line: { borderWidth: 1.4, pointRadius: 0, tension: 0.15 },
          point: { radius: 0 }
        }
      };
    }

    const allCharts = [];

    function makeChart(ctx, labels, datasets, xTitle, yRange) {
      const options = buildChartTheme();
      options.scales.x.title = xTitle
        ? {
            display: true,
            text: xTitle,
            color: cssVar('--chart-tick', '#a8aab0'),
            font: { family: 'system-ui, Segoe UI, Arial, sans-serif', size: 9 }
          }
        : { display: false, text: '' };
      if (yRange) {
        options.scales.y.min = yRange.min;
        options.scales.y.max = yRange.max;
        if (yRange.stepSize != null) {
          options.scales.y.ticks.stepSize = yRange.stepSize;
        }
        if (yRange.title) {
          options.scales.y.title = {
            display: true,
            text: yRange.title,
            color: cssVar('--chart-tick', '#a8aab0'),
            font: { family: 'system-ui, Segoe UI, Arial, sans-serif', size: 9 }
          };
        }
      }
      const chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options
      });
      chart.__xTitle = xTitle || null;
      allCharts.push(chart);
      return chart;
    }

    function restyleCharts() {
      const tick = cssVar('--chart-tick', '#a8aab0');
      const grid = cssVar('--chart-grid', '#2a2a2e');
      const legend = cssVar('--chart-legend', '#e6e6ea');
      const mono = ['--line-1', '--line-2', '--line-3'].map((v) => cssVar(v, '#ffffff'));
      allCharts.forEach((chart) => {
        const o = chart.options;
        o.scales.x.ticks.color = tick;
        o.scales.y.ticks.color = tick;
        o.scales.x.grid.color = grid;
        o.scales.y.grid.color = grid;
        o.plugins.legend.labels.color = legend;
        if (chart.__xTitle) {
          o.scales.x.title.color = tick;
        }
        if (chart.__monochrome) {
          chart.data.datasets.forEach((ds, i) => {
            ds.borderColor = mono[i % mono.length];
          });
        }
        chart.update('none');
      });
    }

    const labels = [];
    /* LSM6DSV16X datasheet: FS ±500 dps, G_So = 17.50 mdps/LSB
     * -> ±28571 LSB at full scale. Axis is padded to ±40000 so printed
     * peaks are not clipped. */
    const GYRO_RAW_FS = 40000;
    const gyroChart = makeChart(document.getElementById('gyroChart'), labels, [
      { label: 'GX', data: [], borderColor: '#f87171' },
      { label: 'GY', data: [], borderColor: '#4ade80' },
      { label: 'GZ', data: [], borderColor: '#60a5fa' }
    ], null, {
      min: -GYRO_RAW_FS,
      max: GYRO_RAW_FS,
      stepSize: 10000,
      title: 'LSB (±500 dps)'
    });
    const accelChart = makeChart(document.getElementById('accelChart'), labels, [
      { label: 'AX', data: [], borderColor: '#f87171' },
      { label: 'AY', data: [], borderColor: '#4ade80' },
      { label: 'AZ', data: [], borderColor: '#60a5fa' }
    ]);
    const baroChart = makeChart(document.getElementById('baroChart'), labels, [
      { label: 'PRESS', data: [], borderColor: cssVar('--line-1', '#ffffff') },
      { label: 'TEMP', data: [], borderColor: cssVar('--line-2', '#9ca3af') }
    ], 't [s]');
    const magChart = makeChart(document.getElementById('magChart'), labels, [
      { label: 'X', data: [], borderColor: cssVar('--line-1', '#ffffff') },
      { label: 'Y', data: [], borderColor: cssVar('--line-2', '#9ca3af') },
      { label: 'Z', data: [], borderColor: cssVar('--line-3', '#6b7280') }
    ], 't [s]');
    baroChart.__monochrome = true;
    magChart.__monochrome = true;

    /* Theme: Cursor-style dark high contrast or light. */
    const THEME_LABELS = { dark: 'Theme: Dark HC', light: 'Theme: Light' };
    let currentTheme = 'dark';

    function applyTheme(theme) {
      currentTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      const btn = document.getElementById('themeToggle');
      btn.textContent = THEME_LABELS[currentTheme];
      btn.setAttribute('aria-pressed', String(currentTheme === 'light'));
      restyleCharts();
      if (window.attitudeScene && window.attitudeScene.setTheme) {
        window.attitudeScene.setTheme(currentTheme);
      }
    }

    function toggleTheme() {
      const next = currentTheme === 'dark' ? 'light' : 'dark';
      try {
        localStorage.setItem('dashboardTheme', next);
      } catch (_) {}
      applyTheme(next);
    }

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    (() => {
      let saved = 'dark';
      try {
        saved = localStorage.getItem('dashboardTheme') || 'dark';
      } catch (_) {}
      applyTheme(saved);
    })();

    const chartVisibility = { baro: false, mag: false };

    function applyChartVisibility(name) {
      const wrap = document.getElementById(`${name}ChartWrap`);
      const btn = document.getElementById(`${name}ChartToggle`);
      const chart = name === 'baro' ? baroChart : magChart;
      const visible = chartVisibility[name];
      wrap.classList.toggle('visible', visible);
      btn.classList.toggle('active', visible);
      btn.setAttribute('aria-pressed', String(visible));
      btn.textContent = visible ? 'Chart: On' : 'Chart: Off';
      if (visible) {
        requestAnimationFrame(() => {
          chart.resize();
          chart.update('none');
        });
      }
    }

    function loadChartVisibility() {
      ['baro', 'mag'].forEach((name) => {
        try {
          chartVisibility[name] = localStorage.getItem(`chartVisible_${name}`) === '1';
        } catch (_) {
          chartVisibility[name] = false;
        }
        applyChartVisibility(name);
      });
    }

    function toggleChartVisibility(name) {
      chartVisibility[name] = !chartVisibility[name];
      try {
        localStorage.setItem(`chartVisible_${name}`, chartVisibility[name] ? '1' : '0');
      } catch (_) {}
      applyChartVisibility(name);
    }

    document.getElementById('baroChartToggle').addEventListener('click', () => toggleChartVisibility('baro'));
    document.getElementById('magChartToggle').addEventListener('click', () => toggleChartVisibility('mag'));
    loadChartVisibility();

    function timeLabelsFromSeries(tMs) {
      if (!tMs || tMs.length === 0) {
        return [];
      }
      const t0 = tMs[0];
      return tMs.map((t) => ((t - t0) * 0.001).toFixed(1));
    }

    function setValues(el, entries) {
      el.innerHTML = entries.map(([k, v]) =>
        `<div class="value-cell"><span>${k}</span><strong>${v}</strong></div>`
      ).join('');
    }

    const VEHICLE_ORDER = ['rocket', 'quad'];
    const VEHICLE_TITLES = {
      rocket: 'Attitude // Starship Stack',
      quad: 'Attitude // Quadcopter'
    };
    const VEHICLE_NEXT_LABEL = {
      rocket: 'Quad',
      quad: 'Rocket'
    };

    let currentVehicle = 'rocket';

    window.syncAttitudeVehicle = function(type) {
      if (!VEHICLE_ORDER.includes(type)) {
        return;
      }
      currentVehicle = type;
      document.getElementById('attitudeTitle').textContent = VEHICLE_TITLES[type];
      document.getElementById('vehicleSwitchBtn').textContent = VEHICLE_NEXT_LABEL[type];
      if (window.attitudeScene) {
        window.attitudeScene.setVehicle(type);
      }
    };

    function setVehicle(type) {
      if (!VEHICLE_ORDER.includes(type)) {
        return;
      }
      try {
        localStorage.setItem('attitudeVehicle', type);
      } catch (_) {}
      window.syncAttitudeVehicle(type);
    }

    function cycleVehicle() {
      const idx = VEHICLE_ORDER.indexOf(currentVehicle);
      setVehicle(VEHICLE_ORDER[(idx + 1) % VEHICLE_ORDER.length]);
    }

    document.getElementById('vehicleSwitchBtn').addEventListener('click', cycleVehicle);

    const axisInverts = { x: false, y: false, z: false };
    let lastAttitudeSample = null;

    function applyAxisInverts(ax, ay, az) {
      return {
        x: axisInverts.x ? -ax : ax,
        y: axisInverts.y ? -ay : ay,
        z: axisInverts.z ? -az : az
      };
    }

    function updateAxisInvertButtons() {
      ['x', 'y', 'z'].forEach((axis) => {
        const btn = document.getElementById(`invert${axis.toUpperCase()}Btn`);
        btn.classList.toggle('active', axisInverts[axis]);
        btn.setAttribute('aria-pressed', String(axisInverts[axis]));
      });
    }

    function saveAxisInverts() {
      try {
        localStorage.setItem('attitudeAxisInverts', JSON.stringify(axisInverts));
      } catch (_) {}
    }

    function loadAxisInverts() {
      try {
        const saved = JSON.parse(localStorage.getItem('attitudeAxisInverts') || '{}');
        axisInverts.x = !!saved.x;
        axisInverts.y = !!saved.y;
        axisInverts.z = !!saved.z;
      } catch (_) {}
      updateAxisInvertButtons();
    }

    function toggleAxisInvert(axis) {
      axisInverts[axis] = !axisInverts[axis];
      saveAxisInverts();
      updateAxisInvertButtons();
      if (lastAttitudeSample) {
        updateAttitude(
          lastAttitudeSample.ax,
          lastAttitudeSample.ay,
          lastAttitudeSample.az,
          lastAttitudeSample.mx,
          lastAttitudeSample.my,
          lastAttitudeSample.mz,
          lastAttitudeSample.gx,
          lastAttitudeSample.gy,
          lastAttitudeSample.gz,
          lastAttitudeSample.tMs
        );
      }
    }

    document.querySelectorAll('.axis-invert-btn[data-axis]').forEach((btn) => {
      btn.addEventListener('click', () => toggleAxisInvert(btn.dataset.axis));
    });

    loadAxisInverts();

    /* Attitude filter modes: raw accel/mag, complementary (gyro fusion),
     * or 1D Kalman per axis. Gyro scale: LSM6DSV16X ±500 dps. */
    const FILTER_MODES = ['raw', 'complementary', 'kalman'];
    const FILTER_LABELS = {
      raw: 'Filter: Raw',
      complementary: 'Filter: Compl',
      kalman: 'Filter: Kalman'
    };
    const FILTER_SOURCE_TAGS = {
      raw: 'Pitch/roll from accelerometer, yaw from magnetometer (tilt-compensated)',
      complementary: 'Compl filter: gyro + accel (tilt) + mag (heading)',
      kalman: 'Kalman filter: gyro + accel (tilt) + mag (heading)'
    };
    const GYRO_DPS_PER_LSB = 0.01750; /* 17.50 mdps/LSB @ ±500 dps */
    const ACCEL_REF_MAG = 8192;

    let attitudeFilterMode = 'raw';
    let lastFilterTimeMs = null;

    const attitudeFilterState = {
      pitch: 0,
      roll: 0,
      yaw: 0,
      initialized: false,
      kalman: {
        pitch: { angle: 0, P: 1 },
        roll: { angle: 0, P: 1 },
        yaw: { angle: 0, P: 1 }
      }
    };

    function wrapAngleDeg(angle) {
      let a = angle % 360;
      if (a < 0) {
        a += 360;
      }
      return a;
    }

    function shortestAngleDeltaDeg(from, to) {
      let d = to - from;
      while (d > 180) {
        d -= 360;
      }
      while (d < -180) {
        d += 360;
      }
      return d;
    }

    function accelToTiltDeg(ax, ay, az) {
      return {
        pitch: Math.atan2(-ax, Math.sqrt(ay * ay + az * az)) * (180 / Math.PI),
        roll: Math.atan2(ay, az) * (180 / Math.PI)
      };
    }

    function tiltToAccel(pitchDeg, rollDeg, magnitude = ACCEL_REF_MAG) {
      const pitch = pitchDeg * (Math.PI / 180);
      const roll = rollDeg * (Math.PI / 180);
      return {
        ax: -Math.sin(pitch) * magnitude,
        ay: Math.cos(pitch) * Math.sin(roll) * magnitude,
        az: Math.cos(pitch) * Math.cos(roll) * magnitude
      };
    }

    function gyroToDps(gx, gy, gz) {
      const g = applyAxisInverts(gx, gy, gz);
      return {
        pitchRate: g.x * GYRO_DPS_PER_LSB,
        rollRate: g.y * GYRO_DPS_PER_LSB,
        yawRate: g.z * GYRO_DPS_PER_LSB
      };
    }

    function resetAttitudeFilter() {
      attitudeFilterState.initialized = false;
      lastFilterTimeMs = null;
      attitudeFilterState.kalman.pitch = { angle: 0, P: 1 };
      attitudeFilterState.kalman.roll = { angle: 0, P: 1 };
      attitudeFilterState.kalman.yaw = { angle: 0, P: 1 };
    }

    function kalmanPredict(state, rateDegPerSec, dt, processNoise) {
      state.angle += rateDegPerSec * dt;
      state.P += processNoise;
    }

    function kalmanUpdate(state, measurement, measurementNoise) {
      const innovation = shortestAngleDeltaDeg(state.angle, measurement);
      const K = state.P / (state.P + measurementNoise);
      state.angle += K * innovation;
      state.P = (1 - K) * state.P;
      return state.angle;
    }

    function complementaryStep(prev, gyroRate, accelAngle, dt, alpha) {
      const predicted = prev + gyroRate * dt;
      return alpha * predicted + (1 - alpha) * accelAngle;
    }

    function complementaryYawStep(prev, gyroRate, magHeading, dt, alpha) {
      const predicted = wrapAngleDeg(prev + gyroRate * dt);
      const delta = shortestAngleDeltaDeg(predicted, magHeading);
      return wrapAngleDeg(predicted - (1 - alpha) * delta);
    }

    function filterAttitude(ax, ay, az, mx, my, mz, gx, gy, gz, tMs) {
      const tilt = accelToTiltDeg(ax, ay, az);
      const magHeading = computeHeading(mx, my, mz, ax, ay, az);

      if (attitudeFilterMode === 'raw' || gx == null || gy == null || gz == null) {
        return {
          ax,
          ay,
          az,
          yaw: magHeading,
          pitch: tilt.pitch,
          roll: tilt.roll,
          filtered: false
        };
      }

      let dt = 0.02;
      if (tMs != null && lastFilterTimeMs != null) {
        dt = Math.max(0.001, Math.min(0.2, (tMs - lastFilterTimeMs) / 1000));
      } else if (lastFilterTimeMs == null) {
        dt = 0.02;
      }
      if (tMs != null) {
        lastFilterTimeMs = tMs;
      }

      const rates = gyroToDps(gx, gy, gz);

      if (!attitudeFilterState.initialized) {
        attitudeFilterState.pitch = tilt.pitch;
        attitudeFilterState.roll = tilt.roll;
        attitudeFilterState.yaw = magHeading ?? 0;
        attitudeFilterState.kalman.pitch.angle = tilt.pitch;
        attitudeFilterState.kalman.roll.angle = tilt.roll;
        attitudeFilterState.kalman.yaw.angle = magHeading ?? 0;
        attitudeFilterState.initialized = true;
      }

      if (attitudeFilterMode === 'complementary') {
        const alpha = 0.985;
        attitudeFilterState.pitch = complementaryStep(
          attitudeFilterState.pitch, rates.pitchRate, tilt.pitch, dt, alpha
        );
        attitudeFilterState.roll = complementaryStep(
          attitudeFilterState.roll, rates.rollRate, tilt.roll, dt, alpha
        );
        if (magHeading != null) {
          attitudeFilterState.yaw = complementaryYawStep(
            attitudeFilterState.yaw, rates.yawRate, magHeading, dt, alpha
          );
        } else {
          attitudeFilterState.yaw = wrapAngleDeg(attitudeFilterState.yaw + rates.yawRate * dt);
        }
      } else if (attitudeFilterMode === 'kalman') {
        const q = 0.04 * dt;
        const rTilt = 2.5;
        const rYaw = 4.0;

        kalmanPredict(attitudeFilterState.kalman.pitch, rates.pitchRate, dt, q);
        kalmanUpdate(attitudeFilterState.kalman.pitch, tilt.pitch, rTilt);
        attitudeFilterState.pitch = attitudeFilterState.kalman.pitch.angle;

        kalmanPredict(attitudeFilterState.kalman.roll, rates.rollRate, dt, q);
        kalmanUpdate(attitudeFilterState.kalman.roll, tilt.roll, rTilt);
        attitudeFilterState.roll = attitudeFilterState.kalman.roll.angle;

        kalmanPredict(attitudeFilterState.kalman.yaw, rates.yawRate, dt, q);
        if (magHeading != null) {
          kalmanUpdate(attitudeFilterState.kalman.yaw, magHeading, rYaw);
        }
        attitudeFilterState.yaw = wrapAngleDeg(attitudeFilterState.kalman.yaw.angle);
      }

      const accel = tiltToAccel(attitudeFilterState.pitch, attitudeFilterState.roll);
      return {
        ax: accel.ax,
        ay: accel.ay,
        az: accel.az,
        yaw: attitudeFilterState.yaw,
        pitch: attitudeFilterState.pitch,
        roll: attitudeFilterState.roll,
        filtered: true
      };
    }

    function updateAttitudeFilterButton() {
      const btn = document.getElementById('attitudeFilterBtn');
      const active = attitudeFilterMode !== 'raw';
      btn.textContent = FILTER_LABELS[attitudeFilterMode];
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));
      document.getElementById('attitudeSourceTag').textContent =
        FILTER_SOURCE_TAGS[attitudeFilterMode];
    }

    function saveAttitudeFilterMode() {
      try {
        localStorage.setItem('attitudeFilterMode', attitudeFilterMode);
      } catch (_) {}
    }

    function loadAttitudeFilterMode() {
      try {
        const saved = localStorage.getItem('attitudeFilterMode');
        if (FILTER_MODES.includes(saved)) {
          attitudeFilterMode = saved;
        }
      } catch (_) {}
      updateAttitudeFilterButton();
    }

    function cycleAttitudeFilter() {
      const idx = FILTER_MODES.indexOf(attitudeFilterMode);
      attitudeFilterMode = FILTER_MODES[(idx + 1) % FILTER_MODES.length];
      resetAttitudeFilter();
      saveAttitudeFilterMode();
      updateAttitudeFilterButton();
      if (lastAttitudeSample) {
        updateAttitude(
          lastAttitudeSample.ax,
          lastAttitudeSample.ay,
          lastAttitudeSample.az,
          lastAttitudeSample.mx,
          lastAttitudeSample.my,
          lastAttitudeSample.mz,
          lastAttitudeSample.gx,
          lastAttitudeSample.gy,
          lastAttitudeSample.gz,
          lastAttitudeSample.tMs
        );
      }
    }

    document.getElementById('attitudeFilterBtn').addEventListener('click', cycleAttitudeFilter);
    loadAttitudeFilterMode();

    /* Remap magnetometer axes into IMU frame (IMU is reference):
     *   IMU X+ = Mag Y+
     *   IMU Y+ = Mag X-
     *   IMU Z+ = Mag Z-
     */
    function remapMagToImu(mx, my, mz) {
      if (mx == null || my == null || mz == null) {
        return null;
      }
      return {
        x: my,
        y: -mx,
        z: -mz
      };
    }

    function computeHeading(mx, my, mz, ax, ay, az) {
      const mag = remapMagToImu(mx, my, mz);
      if (!mag) {
        return null;
      }

      let xh = mag.x;
      let yh = mag.y;

      if (ax != null && ay != null && az != null) {
        const roll = Math.atan2(ay, az);
        const pitch = Math.atan2(-ax, Math.sqrt(ay * ay + az * az));
        const cosRoll = Math.cos(roll);
        const sinRoll = Math.sin(roll);
        const cosPitch = Math.cos(pitch);
        const sinPitch = Math.sin(pitch);

        xh = mag.x * cosPitch + mag.y * sinRoll * sinPitch + mag.z * cosRoll * sinPitch;
        yh = mag.y * cosRoll - mag.z * sinRoll;
      }

      if (xh === 0 && yh === 0) {
        return null;
      }

      let heading = Math.atan2(xh, yh) * (180 / Math.PI);
      if (heading < 0) {
        heading += 360;
      }
      return heading;
    }

    function updateCompass(mx, my, mz, ax, ay, az) {
      const mark = document.getElementById('compassHeadingMark');
      const hdgEl = document.getElementById('compassHdg');
      const heading = computeHeading(mx, my, mz, ax, ay, az);

      if (heading == null) {
        mark.style.transform = 'rotate(0deg)';
        hdgEl.textContent = 'HDG --';
        return;
      }

      mark.style.transform = `rotate(${heading}deg)`;
      hdgEl.textContent = `HDG ${heading.toFixed(0)}°`;
    }

    function updateAttitude(ax, ay, az, mx, my, mz, gx, gy, gz, tMs) {
      const pitchEl = document.getElementById('pitchValue');
      const rollEl = document.getElementById('rollValue');
      const yawEl = document.getElementById('yawValue');

      if (ax == null || ay == null || az == null) {
        if (window.attitudeScene) {
          window.attitudeScene.updateAttitude(null, null, null, null);
        }
        pitchEl.textContent = '--';
        rollEl.textContent = '--';
        yawEl.textContent = '--';
        return;
      }

      lastAttitudeSample = { ax, ay, az, mx, my, mz, gx, gy, gz, tMs };
      const imu = applyAxisInverts(ax, ay, az);
      const attitude = filterAttitude(
        imu.x, imu.y, imu.z, mx, my, mz, gx, gy, gz, tMs
      );

      if (window.attitudeScene) {
        window.attitudeScene.updateAttitude(attitude.ax, attitude.ay, attitude.az, attitude.yaw);
        if (attitude.filtered) {
          pitchEl.textContent = `${attitude.pitch.toFixed(1)}°`;
          rollEl.textContent = `${attitude.roll.toFixed(1)}°`;
        } else {
          const tilt = window.attitudeScene.getTiltAngles(attitude.ax, attitude.ay, attitude.az);
          if (tilt) {
            pitchEl.textContent = `${tilt.pitch.toFixed(1)}°`;
            rollEl.textContent = `${tilt.roll.toFixed(1)}°`;
          }
        }
      }
      yawEl.textContent = attitude.yaw == null ? '--' : `${attitude.yaw.toFixed(1)}°`;

      if (attitude.filtered && attitude.yaw != null) {
        const mark = document.getElementById('compassHeadingMark');
        const hdgEl = document.getElementById('compassHdg');
        mark.style.transform = `rotate(${attitude.yaw}deg)`;
        hdgEl.textContent = `HDG ${attitude.yaw.toFixed(0)}°`;
      }
    }

    function updateCharts(series) {
      const t = series.t_ms || [];
      const xLabels = t.map((_, i) => i);
      const timeLabels = timeLabelsFromSeries(t);

      function sync(chart, keys, useTime) {
        chart.data.labels = useTime ? timeLabels : xLabels;
        keys.forEach((key, idx) => {
          chart.data.datasets[idx].data = series[key] || [];
        });
        chart.update('none');
      }

      sync(gyroChart, ['imu_gx', 'imu_gy', 'imu_gz'], false);
      sync(accelChart, ['imu_ax', 'imu_ay', 'imu_az'], false);
      if (chartVisibility.baro) {
        sync(baroChart, ['baro_press', 'baro_temp'], true);
      } else {
        baroChart.data.labels = timeLabels;
        baroChart.data.datasets[0].data = series.baro_press || [];
        baroChart.data.datasets[1].data = series.baro_temp || [];
      }
      if (chartVisibility.mag) {
        sync(magChart, ['mag_x', 'mag_y', 'mag_z'], true);
      } else {
        magChart.data.labels = timeLabels;
        magChart.data.datasets[0].data = series.mag_x || [];
        magChart.data.datasets[1].data = series.mag_y || [];
        magChart.data.datasets[2].data = series.mag_z || [];
      }
    }

    function applyPayload(payload) {
      const latest = payload.latest || {};
      const imu = latest.imu || {};
      const baro = latest.baro || {};
      const mag = latest.mag || {};
      const status = payload.status || {};

      setValues(document.getElementById('gyroValues'), [
        ['GX', imu.gx ?? '--'], ['GY', imu.gy ?? '--'], ['GZ', imu.gz ?? '--']
      ]);
      setValues(document.getElementById('accelValues'), [
        ['AX', imu.ax ?? '--'], ['AY', imu.ay ?? '--'], ['AZ', imu.az ?? '--']
      ]);
      setValues(document.getElementById('baroValues'), [
        ['PRESS', baro.press_raw ?? '--'], ['TEMP', baro.temp_raw ?? '--'], ['ST', baro.st ?? '--']
      ]);
      setValues(document.getElementById('magValues'), [
        ['X', mag.x ?? '--'], ['Y', mag.y ?? '--'], ['Z', mag.z ?? '--']
      ]);

      if (attitudeFilterMode === 'raw') {
        updateCompass(mag.x, mag.y, mag.z, imu.ax, imu.ay, imu.az);
      }
      updateAttitude(
        imu.ax, imu.ay, imu.az,
        mag.x, mag.y, mag.z,
        imu.gx, imu.gy, imu.gz,
        latest.t_ms ?? null
      );

      const dot = document.getElementById('connDot');
      const connText = document.getElementById('connText');
      if (status.connected) {
        dot.classList.add('ok');
        connText.textContent = `Link (${status.port})`;
      } else {
        dot.classList.remove('ok');
        connText.textContent = status.error || 'Offline';
      }

      document.getElementById('lineCount').textContent = `PKT ${status.lines_parsed || 0}`;
      document.getElementById('lastUpdate').textContent = status.last_line_at
        ? `T+ ${new Date(status.last_line_at * 1000).toLocaleTimeString()}`
        : 'T+ --';

      updateCharts(payload.series || {});
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const port = document.getElementById('port').value.trim();
      const baud = Number(document.getElementById('baud').value);
      await fetch('/api/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port, baud })
      });
    });

    const source = new EventSource('/api/stream');
    source.onmessage = (event) => {
      applyPayload(JSON.parse(event.data));
    };

    /* ================= Space background ================= */

    function buildStarfield() {
      const starCount = 1500;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);
      const tint = new THREE.Color();

      for (let i = 0; i < starCount; i++) {
        // Random direction on a sphere shell so stars surround the camera.
        const r = 55 + Math.random() * 25;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

        const m = 0.35 + Math.random() * 0.65;
        const hueRoll = Math.random();
        if (hueRoll < 0.12) {
          tint.setRGB(m * 0.75, m * 0.85, m); // blue-white
        } else if (hueRoll < 0.2) {
          tint.setRGB(m, m * 0.85, m * 0.7); // warm
        } else {
          tint.setRGB(m, m, m);
        }
        colors[i * 3] = tint.r;
        colors[i * 3 + 1] = tint.g;
        colors[i * 3 + 2] = tint.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.14,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        sizeAttenuation: true,
        depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    /* NASA-style Earth: real satellite textures + day/night terminator shader
     * + ocean sun glint + atmospheric scattering rim. */

    const texLoader = new THREE.TextureLoader();
    const EARTH_TEX = '/static/textures/earth/';

    function loadEarthTex(name, srgb) {
      const t = texLoader.load(EARTH_TEX + name);
      if (srgb) {
        t.colorSpace = THREE.SRGBColorSpace;
      }
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }

    const earthVertexShader = `
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const earthFragmentShader = `
      uniform sampler2D dayMap;
      uniform sampler2D nightMap;
      uniform sampler2D specularMap;
      uniform sampler2D normalMap;
      uniform vec3 sunDirection;
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;

      void main() {
        vec3 n = normalize(vWorldNormal);

        // Sphere tangent frame for normal-map relief
        vec3 tangent = normalize(cross(vec3(0.0, 1.0, 0.0), n));
        vec3 bitangent = cross(n, tangent);
        vec3 mapN = texture2D(normalMap, vUv).xyz * 2.0 - 1.0;
        vec3 bumpedN = normalize(tangent * mapN.x + bitangent * mapN.y + n * (mapN.z * 2.0));

        float sunDot = dot(n, sunDirection);
        float dayFactor = smoothstep(-0.12, 0.25, sunDot);

        vec3 dayColor = texture2D(dayMap, vUv).rgb;
        vec3 nightColor = texture2D(nightMap, vUv).rgb;

        // Diffuse shading with relief on the day side
        float diffuse = clamp(dot(bumpedN, sunDirection), 0.0, 1.0);
        vec3 lit = dayColor * (0.18 + 0.95 * diffuse);

        // City lights on the night side
        vec3 night = nightColor * vec3(1.0, 0.88, 0.7) * 1.6;

        vec3 color = mix(night, lit, dayFactor);

        // Ocean sun glint
        float specMask = texture2D(specularMap, vUv).r;
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 reflected = reflect(-sunDirection, bumpedN);
        float spec = pow(clamp(dot(reflected, viewDir), 0.0, 1.0), 22.0);
        color += vec3(0.85, 0.9, 1.0) * spec * specMask * dayFactor * 0.55;

        // Rayleigh-ish blue tint near the limb (in-surface atmosphere)
        float fresnel = pow(1.0 - clamp(dot(viewDir, n), 0.0, 1.0), 2.4);
        color += vec3(0.18, 0.38, 0.85) * fresnel * (0.25 + 0.75 * dayFactor);

        gl_FragColor = vec4(color, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;

    const atmosphereVertexShader = `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const atmosphereFragmentShader = `
      uniform vec3 sunDirection;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 n = normalize(vWorldNormal);
        vec3 viewDir = normalize(cameraPosition - vWorldPos);

        // Thin bright rim that fades toward the middle of the disc
        float rim = pow(1.0 - abs(dot(viewDir, n)), 3.2);

        // Scattering is strongest on the sunlit limb
        float sunFactor = clamp(dot(n, sunDirection) * 0.85 + 0.45, 0.0, 1.0);

        vec3 dayGlow = vec3(0.25, 0.5, 1.0);
        vec3 duskGlow = vec3(0.55, 0.3, 0.35);
        vec3 glow = mix(duskGlow, dayGlow, sunFactor);

        gl_FragColor = vec4(glow, rim * sunFactor * 1.4);
      }
    `;

    function buildEarth() {
      const g = new THREE.Group();
      const R = 11;

      const surface = new THREE.Mesh(
        new THREE.SphereGeometry(R, 128, 96),
        new THREE.ShaderMaterial({
          uniforms: {
            dayMap: { value: loadEarthTex('day.jpg', true) },
            nightMap: { value: loadEarthTex('night.jpg', true) },
            specularMap: { value: loadEarthTex('specular.jpg', false) },
            normalMap: { value: loadEarthTex('normal.jpg', false) },
            sunDirection: { value: sunDirection }
          },
          vertexShader: earthVertexShader,
          fragmentShader: earthFragmentShader
        })
      );
      g.add(surface);

      // Cloud deck: white clouds on black -> used as alpha mask
      const cloudTex = loadEarthTex('clouds.jpg', false);
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(R * 1.012, 96, 72),
        new THREE.MeshLambertMaterial({
          color: 0xffffff,
          alphaMap: cloudTex,
          transparent: true,
          opacity: 0.92,
          depthWrite: false
        })
      );
      g.add(clouds);

      // Atmospheric scattering shell (backside, additive)
      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(R * 1.045, 96, 72),
        new THREE.ShaderMaterial({
          uniforms: { sunDirection: { value: sunDirection } },
          vertexShader: atmosphereVertexShader,
          fragmentShader: atmosphereFragmentShader,
          side: THREE.BackSide,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      g.add(atmosphere);

      g.userData.surface = surface;
      g.userData.clouds = clouds;
      return g;
    }

    const starfield = buildStarfield();
    scene.add(starfield);

    const earth = buildEarth();
