    /* ==================================================== */

    const STARSHIP_TEX = '/static/textures/starship/';

    function loadRepeatTexture(path, repeatX, repeatY, srgb) {
      const tex = texLoader.load(path);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (srgb) {
        tex.colorSpace = THREE.SRGBColorSpace;
      }
      return tex;
    }

    function metalMaterial(color, metalness, roughness, envMapIntensity = 1.15) {
      return new THREE.MeshStandardMaterial({
        color,
        metalness,
        roughness,
        envMapIntensity
      });
    }

    /* The space HDR is almost black, so a near-mirror metal would render
     * flat black. Keep metalness moderate so the brushed-steel map still
     * reads as diffuse detail while retaining a metallic sheen. */
    function brushedSteelMaterial(color, repeatY, envMapIntensity = 1.75) {
      const steelMap = loadRepeatTexture(`${STARSHIP_TEX}steel-brushed.svg`, 1.0, repeatY, true);
      const steelBump = loadRepeatTexture(`${STARSHIP_TEX}steel-brushed.svg`, 1.0, repeatY, false);
      return new THREE.MeshStandardMaterial({
        color,
        map: steelMap,
        bumpMap: steelBump,
        bumpScale: 0.012,
        metalness: 0.5,
        roughness: 0.34,
        envMapIntensity
      });
    }

    function heatShieldMaterial(repeatX, repeatY, envMapIntensity = 0.45) {
      const tileMap = loadRepeatTexture(`${STARSHIP_TEX}heat-shield-tiles.svg`, repeatX, repeatY, true);
      const tileBump = loadRepeatTexture(`${STARSHIP_TEX}heat-shield-tiles.svg`, repeatX, repeatY, false);
      return new THREE.MeshStandardMaterial({
        color: 0x1a1d22,
        map: tileMap,
        bumpMap: tileBump,
        bumpScale: 0.032,
        metalness: 0.08,
        roughness: 0.92,
        envMapIntensity
      });
    }

    function buildParabolicNose(radius, length, segments, material) {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        points.push(new THREE.Vector2(radius * Math.sqrt(1 - t), t * length));
      }
      const geo = new THREE.LatheGeometry(points, 48);
      return new THREE.Mesh(geo, material);
    }

    // Raptor 3 bell: lathe-revolved nozzle with a curved flare.
    function buildRaptorBell(throatR, exitR, height, material) {
      const pts = [];
      const seg = 10;
      for (let i = 0; i <= seg; i++) {
        const t = i / seg;
        const r = throatR + (exitR - throatR) * Math.pow(t, 1.5);
        pts.push(new THREE.Vector2(r, -t * height));
      }
      const geo = new THREE.LatheGeometry(pts, 18);
      return new THREE.Mesh(geo, material);
    }

    // Twin-layer animated exhaust plume for one engine.
    function buildFlame(scale) {
      const g = new THREE.Group();

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0xff7a1a,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const outerH = 0.34 * scale;
      const outer = new THREE.Mesh(new THREE.ConeGeometry(0.05 * scale, outerH, 14, 1, true), outerMat);
      outer.rotation.x = Math.PI;
      outer.position.y = -outerH / 2;
      g.add(outer);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0x9ecbff,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const innerH = 0.5 * scale;
      const inner = new THREE.Mesh(new THREE.ConeGeometry(0.026 * scale, innerH, 14, 1, true), innerMat);
      inner.rotation.x = Math.PI;
      inner.position.y = -innerH / 2;
      g.add(inner);

      g.userData.outer = outer;
      g.userData.inner = inner;
      g.userData.phase = Math.random() * Math.PI * 2;
      return g;
    }

    function buildRocket() {
      const group = new THREE.Group();
      const flames = [];
      const SEG = 64;
      const R = 0.33;
      const skirtH = 0.14;
      const boosterH = 1.42;
      const hotStageH = 0.07;
      const stageH = 0.92;
      const noseH = 0.5;

      const boosterMat = brushedSteelMaterial(0x8b9193, 8.0, 1.85);
      const bandMat = brushedSteelMaterial(0x40464a, 3.0, 1.35);
      const skirtMat = brushedSteelMaterial(0x2e3336, 2.0, 1.25);
      const stageMat = brushedSteelMaterial(0xd1d5d7, 5.5, 2.1);
      const noseMat = brushedSteelMaterial(0xf2f4f4, 2.2, 2.25);
      const bellMat = brushedSteelMaterial(0x9a9a9a, 1.2, 1.5);
      const bellRimMat = metalMaterial(0x2c2c2c, 0.65, 0.48, 0.9);
      const finMat = brushedSteelMaterial(0x545b60, 1.8, 1.2);
      const flapMat = brushedSteelMaterial(0xbfc5c7, 2.0, 1.9);
      const tpsEdgeMat = metalMaterial(0x0a0b0d, 0.15, 0.88, 0.25);
      const ventMat = metalMaterial(0x050607, 0.2, 0.9, 0.2);

      function makeSpacexDecal() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 512, 128);
        ctx.fillStyle = '#1a1d20';
        ctx.font = 'bold 72px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SPACEX', 256, 64);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return new THREE.MeshStandardMaterial({
          map: tex,
          transparent: true,
          metalness: 0.35,
          roughness: 0.55,
          envMapIntensity: 0.8
        });
      }

      function addWeldRings(yStart, yEnd, count, radius) {
        const step = (yEnd - yStart) / count;
        for (let i = 1; i < count; i++) {
          const ring = new THREE.Mesh(
            new THREE.CylinderGeometry(radius * 1.008, radius * 1.008, 0.012, SEG),
            bandMat
          );
          ring.position.y = yStart + step * i;
          group.add(ring);
        }
      }

      let y = 0;

      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.0, R * 1.08, skirtH, SEG), skirtMat);
      skirt.position.y = y + skirtH / 2;
      group.add(skirt);

      const deck = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.04, R * 1.04, 0.02, SEG), bellRimMat);
      deck.position.y = y + 0.02;
      group.add(deck);

      function addRaptorRing(countN, ringR, throatR, exitR, h, flameScale) {
        for (let i = 0; i < countN; i++) {
          const angle = (i / countN) * Math.PI * 2 + (countN % 2 ? 0.1 : 0);
          const px = Math.cos(angle) * ringR;
          const pz = Math.sin(angle) * ringR;

          const bell = buildRaptorBell(throatR, exitR, h, bellMat);
          bell.position.set(px, y + 0.01, pz);
          group.add(bell);

          const rim = new THREE.Mesh(
            new THREE.TorusGeometry(exitR, exitR * 0.12, 6, 16),
            bellRimMat
          );
          rim.rotation.x = Math.PI / 2;
          rim.position.set(px, y + 0.01 - h, pz);
          group.add(rim);

          const flame = buildFlame(flameScale);
          flame.position.set(px, y + 0.01 - h, pz);
          group.add(flame);
          flames.push(flame);
        }
      }

      addRaptorRing(13, R * 0.78, 0.022, 0.05, 0.12, 0.85);
      addRaptorRing(7, R * 0.42, 0.02, 0.045, 0.11, 0.8);
      addRaptorRing(3, R * 0.16, 0.022, 0.05, 0.12, 1.0);

      y += skirtH;

      const booster = new THREE.Mesh(new THREE.CylinderGeometry(R, R, boosterH, SEG), boosterMat);
      booster.position.y = y + boosterH / 2;
      group.add(booster);
      addWeldRings(y + 0.1, y + boosterH - 0.1, 11, R);

      const chine = new THREE.Mesh(new THREE.BoxGeometry(0.03, boosterH * 0.92, 0.07), bandMat);
      chine.position.set(R + 0.005, y + boosterH / 2, 0);
      group.add(chine);
      const chine2 = new THREE.Mesh(new THREE.BoxGeometry(0.025, boosterH * 0.75, 0.055), bandMat);
      chine2.position.set(-(R + 0.004), y + boosterH / 2 + 0.05, 0);
      group.add(chine2);

      [-1, 1].forEach((side) => {
        const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.09, 12), bellRimMat);
        pin.rotation.z = Math.PI / 2;
        pin.position.set(side * (R + 0.04), y + boosterH - 0.28, 0);
        group.add(pin);
        const collar = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 8, 16), bandMat);
        collar.rotation.y = Math.PI / 2;
        collar.position.copy(pin.position);
        group.add(collar);
      });

      const decal = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.09), makeSpacexDecal());
      decal.position.set(0, y + boosterH * 0.55, -(R + 0.002));
      decal.rotation.y = Math.PI;
      group.add(decal);

      function buildGridFin() {
        const fin = new THREE.Group();
        const W = 0.18;
        const H = 0.16;
        const T = 0.018;
        const edge = 0.016;

        [[0, H / 2 - edge / 2], [0, -H / 2 + edge / 2]].forEach(([fx, fy]) => {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(W, edge, T), finMat);
          bar.position.set(fx, fy, 0);
          fin.add(bar);
        });
        [[W / 2 - edge / 2, 0], [-W / 2 + edge / 2, 0]].forEach(([fx, fy]) => {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(edge, H, T), finMat);
          bar.position.set(fx, fy, 0);
          fin.add(bar);
        });
        [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sy]) => {
          const corner = new THREE.Mesh(new THREE.BoxGeometry(edge * 1.2, edge * 1.2, T * 1.15), finMat);
          corner.position.set(sx * (W / 2 - edge / 2), sy * (H / 2 - edge / 2), 0);
          fin.add(corner);
        });

        const slat = 0.006;
        for (let i = 1; i < 5; i++) {
          const v = new THREE.Mesh(new THREE.BoxGeometry(slat, H - edge, T * 0.8), finMat);
          v.position.x = -W / 2 + (W / 5) * i;
          fin.add(v);
        }
        for (let i = 1; i < 4; i++) {
          const hBar = new THREE.Mesh(new THREE.BoxGeometry(W - edge, slat, T * 0.8), finMat);
          hBar.position.y = -H / 2 + (H / 4) * i;
          fin.add(hBar);
        }
        return fin;
      }

      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
        const fin = buildGridFin();
        fin.position.set(
          Math.cos(angle) * (R + 0.08),
          y + boosterH - 0.16,
          Math.sin(angle) * (R + 0.08)
        );
        fin.rotation.y = -angle + Math.PI / 2;
        group.add(fin);

        const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.06, 10), bellRimMat);
        hinge.rotation.z = Math.PI / 2;
        hinge.rotation.y = -angle;
        hinge.position.set(
          Math.cos(angle) * (R + 0.025),
          y + boosterH - 0.16,
          Math.sin(angle) * (R + 0.025)
        );
        group.add(hinge);
      }

      y += boosterH;

      const hotRing = new THREE.Mesh(
        new THREE.CylinderGeometry(R * 1.0, R * 1.0, hotStageH, SEG, 1, true),
        skirtMat
      );
      hotRing.position.y = y + hotStageH / 2;
      group.add(hotRing);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.035, hotStageH * 0.7, 0.012), ventMat);
        vent.position.set(Math.cos(a) * (R * 1.005), y + hotStageH / 2, Math.sin(a) * (R * 1.005));
        vent.rotation.y = -a;
        group.add(vent);
      }
      y += hotStageH;

      const stage = new THREE.Mesh(new THREE.CylinderGeometry(R, R, stageH, SEG), stageMat);
      stage.position.y = y + stageH / 2;
      group.add(stage);
      addWeldRings(y + 0.08, y + stageH - 0.08, 8, R);

      // Windward TPS half-shell, rotated so the default camera sees both the
      // black tiles and the bare stainless side.
      const TPS_START = Math.PI / 4;
      const tileMat = heatShieldMaterial(5.0, 12.0);
      const tileShell = new THREE.Mesh(
        new THREE.CylinderGeometry(R * 1.014, R * 1.014, stageH, SEG, 1, true, TPS_START, Math.PI),
        tileMat
      );
      tileShell.position.y = y + stageH / 2;
      group.add(tileShell);

      [TPS_START, TPS_START + Math.PI].forEach((a0) => {
        const edge = new THREE.Mesh(
          new THREE.CylinderGeometry(R * 1.018, R * 1.018, stageH, 8, 1, true, a0 - 0.04, 0.08),
          tpsEdgeMat
        );
        edge.position.y = y + stageH / 2;
        group.add(edge);
      });

      for (let i = 1; i < 12; i++) {
        const seam = new THREE.Mesh(
          new THREE.CylinderGeometry(R * 1.02, R * 1.02, 0.004, SEG, 1, true, TPS_START, Math.PI),
          metalMaterial(0x030303, 0.08, 0.92, 0.2)
        );
        seam.position.y = y + (stageH / 12) * i;
        group.add(seam);
      }

      const raceway = new THREE.Mesh(new THREE.BoxGeometry(0.025, stageH * 0.9, 0.05), bandMat);
      raceway.position.set(0, y + stageH / 2, -(R + 0.005));
      group.add(raceway);

      function buildFlap(rootW, tipW, len, thick) {
        const s = new THREE.Shape();
        s.moveTo(0, -rootW / 2);
        s.lineTo(len, -tipW / 2);
        s.quadraticCurveTo(len + tipW * 0.35, 0, len, tipW / 2);
        s.lineTo(0, rootW / 2);
        s.closePath();
        const geo = new THREE.ExtrudeGeometry(s, {
          depth: thick,
          bevelEnabled: true,
          bevelThickness: 0.006,
          bevelSize: 0.006,
          bevelSegments: 2
        });
        geo.translate(0, 0, -thick / 2);
        const flap = new THREE.Mesh(geo, flapMat);

        const tileFace = new THREE.Mesh(geo.clone().scale(0.96, 0.96, 0.4), tileMat);
        tileFace.position.z = thick * 0.45;
        flap.add(tileFace);

        const cover = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, rootW * 0.85, thick * 1.4),
          tileMat
        );
        cover.position.set(0.015, 0, thick * 0.15);
        flap.add(cover);
        return flap;
      }

      [1, -1].forEach((sx) => {
        const fwd = buildFlap(0.13, 0.05, 0.14, 0.028);
        fwd.position.set(sx * (R * 0.92), y + stageH - 0.12, 0);
        fwd.rotation.z = sx > 0 ? -0.18 : Math.PI + 0.18;
        group.add(fwd);
      });
      [1, -1].forEach((sx) => {
        const aft = buildFlap(0.2, 0.08, 0.2, 0.034);
        aft.position.set(sx * (R * 0.94), y + 0.17, 0);
        aft.rotation.z = sx > 0 ? -0.12 : Math.PI + 0.12;
        group.add(aft);
      });

      for (let i = 0; i < 3; i++) {
        const angle = (i / 3) * Math.PI * 2;
        const bell = buildRaptorBell(0.018, 0.04, 0.08, bellMat);
        bell.position.set(Math.cos(angle) * R * 0.3, y + 0.04, Math.sin(angle) * R * 0.3);
        group.add(bell);
      }

      y += stageH;

      const nose = buildParabolicNose(R, noseH, 32, noseMat);
      nose.position.y = y;
      group.add(nose);

      const noseTilePts = [];
      for (let i = 0; i <= 32; i++) {
        const t = i / 32;
        noseTilePts.push(new THREE.Vector2(R * 1.014 * Math.sqrt(1 - t), t * noseH * 0.96));
      }
      const noseTiles = new THREE.Mesh(
        new THREE.LatheGeometry(noseTilePts, 32, TPS_START, Math.PI),
        tileMat
      );
      noseTiles.position.y = y;
      group.add(noseTiles);

      const starlinkStrip = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.14, 0.014),
        metalMaterial(0x050505, 0.25, 0.75, 0.35)
      );
      starlinkStrip.position.set(0, y + noseH * 0.42, -R * 0.58);
      starlinkStrip.rotation.x = -0.55;
      group.add(starlinkStrip);
      const antenna = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.07, 0.01), bandMat);
      antenna.position.set(0, y + noseH * 0.52, -R * 0.5);
      antenna.rotation.x = -0.5;
      group.add(antenna);

      const engineLight = new THREE.PointLight(0xff8c33, 1.6, 2.2, 2);
      engineLight.position.y = -0.22;
      group.add(engineLight);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.26, 20, 14),
        new THREE.MeshBasicMaterial({
          color: 0xff6a1a,
          transparent: true,
          opacity: 0.1,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      halo.position.y = -0.18;
      halo.scale.y = 0.65;
      group.add(halo);

      const totalH = y + noseH;
      group.position.y = -totalH / 2 + 0.15;
      group.userData.flames = flames;
      group.userData.engineLight = engineLight;
      group.userData.halo = halo;
      return group;
    }

    /* 6/7-inch long-range X-frame quad: stretched carbon arms, 6S pack,
     * GPS mast, action cam and 3-blade cinematic props. */
    function buildQuadcopter() {
      const group = new THREE.Group();
      const props = [];
      const QUAD_TEX = '/static/textures/quad/';

      // Frame geometry in scene units (1 unit ~ 24 cm at this scale).
      const ARM_LEN = 0.74;        // motor-to-center distance (7" class)
      const PROP_R = 0.36;         // 7" propeller radius
      const PLATE_W = 0.3;

      const carbonMap = loadRepeatTexture(`${QUAD_TEX}carbon-weave.svg`, 3, 3, true);
      const carbonBump = loadRepeatTexture(`${QUAD_TEX}carbon-weave.svg`, 3, 3, false);
      const carbonMat = new THREE.MeshStandardMaterial({
        color: 0x1b1b1f,
        map: carbonMap,
        bumpMap: carbonBump,
        bumpScale: 0.008,
        metalness: 0.18,
        roughness: 0.68,
        envMapIntensity: 0.6
      });
      const carbonArmMat = carbonMat.clone();
      carbonArmMat.color = new THREE.Color(0x141417);
      const aluMat = metalMaterial(0x9aa3ad, 0.85, 0.3, 1.15);
      const aluRedMat = metalMaterial(0xc2410c, 0.7, 0.35, 0.9);
      const motorBellMat = metalMaterial(0x25252a, 0.75, 0.32, 1.0);
      const statorMat = metalMaterial(0x4a4a50, 0.6, 0.45, 0.8);
      const escMat = metalMaterial(0x14331f, 0.2, 0.7, 0.4);
      const fcMat = metalMaterial(0x102b1a, 0.25, 0.65, 0.45);
      const packMat = metalMaterial(0x14161c, 0.25, 0.62, 0.45);
      const packWrapMat = metalMaterial(0x2b3444, 0.3, 0.5, 0.5);
      const strapMat = metalMaterial(0xdc2626, 0.12, 0.72, 0.25);
      const darkPlasticMat = metalMaterial(0x0e0e11, 0.3, 0.62, 0.4);
      const lensMat = new THREE.MeshStandardMaterial({
        color: 0x0d1117,
        metalness: 0.95,
        roughness: 0.12,
        envMapIntensity: 1.6
      });
      const propMat = new THREE.MeshStandardMaterial({
        color: 0xc7ccd4,
        metalness: 0.12,
        roughness: 0.5,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });
      const blurMat = new THREE.MeshBasicMaterial({
        color: 0x94a3b8,
        transparent: true,
        opacity: 0.1,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      // ---- Carbon plates (bottom thick, top thin) ----
      const bottom = new THREE.Mesh(new THREE.BoxGeometry(PLATE_W, 0.016, PLATE_W * 1.15), carbonMat);
      bottom.position.y = -0.012;
      group.add(bottom);
      const top = new THREE.Mesh(new THREE.BoxGeometry(PLATE_W * 0.92, 0.012, PLATE_W * 1.0), carbonMat);
      top.position.y = 0.072;
      group.add(top);

      [[-0.1, -0.12], [0.1, -0.12], [-0.1, 0.12], [0.1, 0.12]].forEach(([sx, sz]) => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.076, 12), aluRedMat);
        post.position.set(sx, 0.03, sz);
        group.add(post);
      });

      // Tapered long-range arm: wide at the root, thin at the motor mount.
      function buildArmProfile() {
        const s = new THREE.Shape();
        s.moveTo(0, -0.034);
        s.lineTo(ARM_LEN * 0.55, -0.02);
        s.lineTo(ARM_LEN, -0.026);
        s.lineTo(ARM_LEN, 0.026);
        s.lineTo(ARM_LEN * 0.55, 0.02);
        s.lineTo(0, 0.034);
        s.closePath();
        return new THREE.ExtrudeGeometry(s, {
          depth: 0.026,
          bevelEnabled: true,
          bevelThickness: 0.003,
          bevelSize: 0.003,
          bevelSegments: 1
        });
      }

      // 3-blade cinematic blade outline with washout twist.
      function buildPropBlade() {
        const s = new THREE.Shape();
        s.moveTo(0.02, -0.012);
        s.quadraticCurveTo(0.12, 0.034, 0.24, 0.026);
        s.quadraticCurveTo(0.33, 0.018, PROP_R, 0.002);
        s.quadraticCurveTo(0.32, -0.02, 0.22, -0.026);
        s.quadraticCurveTo(0.1, -0.03, 0.02, -0.012);
        return new THREE.ExtrudeGeometry(s, { depth: 0.0045, bevelEnabled: false });
      }

      function buildMotor(cw) {
        const motor = new THREE.Group();

        // 2807-class stator + bell
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.07, 0.024, 24), statorMat);
        motor.add(base);
        const bell = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.062, 0.052, 24), motorBellMat);
        bell.position.y = 0.036;
        motor.add(bell);
        const bellTop = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.006, 24), aluMat);
        bellTop.position.y = 0.063;
        motor.add(bellTop);

        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2;
          const slot = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.032, 0.005), darkPlasticMat);
          slot.position.set(Math.cos(a) * 0.06, 0.036, Math.sin(a) * 0.06);
          slot.rotation.y = -a;
          motor.add(slot);
        }

        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.045, 10), aluMat);
        shaft.position.y = 0.082;
        motor.add(shaft);
        const nut = new THREE.Mesh(
          new THREE.CylinderGeometry(0.014, 0.014, 0.012, 6),
          metalMaterial(cw ? 0x22c55e : 0xef4444, 0.45, 0.42, 0.7)
        );
        nut.position.y = 0.104;
        motor.add(nut);

        const prop = new THREE.Group();
        prop.position.y = 0.09;
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.026, 0.012, 16), darkPlasticMat);
        prop.add(hub);
        for (let b = 0; b < 3; b++) {
          const blade = new THREE.Mesh(buildPropBlade(), propMat);
          blade.rotation.y = (b / 3) * Math.PI * 2;
          blade.rotation.z = cw ? 0.16 : -0.16;
          prop.add(blade);
        }
        const blur = new THREE.Mesh(new THREE.CircleGeometry(PROP_R, 40), blurMat);
        blur.rotation.x = -Math.PI / 2;
        blur.position.y = 0.006;
        prop.add(blur);
        motor.add(prop);

        motor.userData.prop = prop;
        motor.userData.spinDir = cw ? 1 : -1;
        props.push(motor);
        return motor;
      }

      // ---- X arms at 45 degrees ----
      [45, 135, 225, 315].forEach((deg, idx) => {
        const armPivot = new THREE.Group();
        armPivot.rotation.y = THREE.MathUtils.degToRad(deg);

        const arm = new THREE.Mesh(buildArmProfile(), carbonArmMat);
        arm.rotation.x = -Math.PI / 2;
        arm.position.set(0.03, 0.006, 0);
        armPivot.add(arm);

        // Motor mount pad + soft-mount screws
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.008, 20), carbonArmMat);
        pad.position.set(ARM_LEN, 0.012, 0);
        armPivot.add(pad);

        const motor = buildMotor(idx % 2 === 0);
        motor.position.set(ARM_LEN, 0.026, 0);
        armPivot.add(motor);

        // ESC signal wire bundle taped along the arm
        const wire = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, ARM_LEN * 0.8, 6),
          metalMaterial(0x2b2b30, 0.3, 0.7, 0.3)
        );
        wire.rotation.z = Math.PI / 2;
        wire.position.set(ARM_LEN * 0.5, 0.026, 0.018);
        armPivot.add(wire);

        // Landing leg + foot
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.024), carbonArmMat);
        leg.position.set(ARM_LEN * 0.6, -0.068, 0);
        armPivot.add(leg);
        const foot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 10), darkPlasticMat);
        foot.position.set(ARM_LEN * 0.6, -0.132, 0);
        armPivot.add(foot);

        group.add(armPivot);
      });

      // ---- Electronics stack ----
      const esc = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.012, 0.13), escMat);
      esc.position.y = 0.018;
      group.add(esc);
      const fc = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.011, 0.11), fcMat);
      fc.position.y = 0.046;
      group.add(fc);
      [[-0.04, -0.04], [0.04, -0.04], [-0.04, 0.04], [0.04, 0.04]].forEach(([sx, sz]) => {
        const so = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.028, 8), aluMat);
        so.position.set(sx, 0.032, sz);
        group.add(so);
      });
      const usb = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.011, 0.014), aluMat);
      usb.position.set(0, 0.046, -0.058);
      group.add(usb);
      // 6S low-ESR cap
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.04, 14), metalMaterial(0x0b1220, 0.5, 0.4, 0.6));
      cap.rotation.z = Math.PI / 2;
      cap.position.set(0.075, 0.02, 0.05);
      group.add(cap);

      // ---- 6S Li-ion pack on top ----
      const pack = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.07, 0.13), packMat);
      pack.position.set(0, 0.115, 0.01);
      group.add(pack);
      const packLabel = new THREE.Mesh(new THREE.BoxGeometry(0.262, 0.026, 0.132), packWrapMat);
      packLabel.position.set(0, 0.128, 0.01);
      group.add(packLabel);
      [-0.07, 0.07].forEach((sx) => {
        const strap = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.086, 0.15), strapMat);
        strap.position.set(sx, 0.114, 0.01);
        group.add(strap);
      });
      const xt60 = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.022, 0.026), metalMaterial(0xf59e0b, 0.3, 0.5, 0.45));
      xt60.position.set(0.15, 0.108, 0.01);
      group.add(xt60);

      // ---- GPS mast (long-range staple) ----
      const gpsMast = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.13, 8), aluMat);
      gpsMast.position.set(0, 0.13, 0.12);
      group.add(gpsMast);
      const gpsPuck = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.014, 20), darkPlasticMat);
      gpsPuck.position.set(0, 0.2, 0.12);
      group.add(gpsPuck);
      const gpsTop = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.036, 0.008, 20), metalMaterial(0xe2e8f0, 0.3, 0.45, 0.6));
      gpsTop.position.set(0, 0.209, 0.12);
      group.add(gpsTop);

      // ---- Action cam (top) + FPV cam (front, -Z) ----
      const camCage = new THREE.Group();
      camCage.position.set(0, 0.17, -0.06);
      camCage.rotation.x = -0.4;
      const actionCam = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.06, 0.05), darkPlasticMat);
      camCage.add(actionCam);
      const actionLens = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.021, 0.016, 18), lensMat);
      actionLens.rotation.x = Math.PI / 2;
      actionLens.position.set(0.014, 0.004, -0.032);
      camCage.add(actionLens);
      group.add(camCage);

      const fpvMount = new THREE.Group();
      fpvMount.position.set(0, 0.042, -0.14);
      fpvMount.rotation.x = -0.45;
      const fpvBody = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.042, 0.042), darkPlasticMat);
      fpvMount.add(fpvBody);
      const fpvLens = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.022, 16), lensMat);
      fpvLens.rotation.x = Math.PI / 2;
      fpvLens.position.z = -0.028;
      fpvMount.add(fpvLens);
      group.add(fpvMount);

      // ---- VTX pagoda antenna (rear) ----
      const vtxMast = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.15, 8), aluMat);
      vtxMast.position.set(0, 0.14, 0.17);
      group.add(vtxMast);
      const vtxCan = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.05, 16), metalMaterial(0xf97316, 0.25, 0.55, 0.45));
      vtxCan.position.set(0, 0.235, 0.17);
      group.add(vtxCan);

      // ---- ELRS receiver antennas in a V ----
      [-1, 1].forEach((side) => {
        const ant = new THREE.Mesh(
          new THREE.CylinderGeometry(0.003, 0.003, 0.19, 6),
          metalMaterial(0x94a3b8, 0.4, 0.5, 0.5)
        );
        ant.position.set(side * 0.1, 0.135, 0.12);
        ant.rotation.z = side * 0.5;
        ant.rotation.x = 0.3;
        group.add(ant);
      });

      // ---- Heading LEDs ----
      const frontLed = new THREE.Mesh(
        new THREE.SphereGeometry(0.019, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0x4ade80, emissive: 0x4ade80, emissiveIntensity: 1.8 })
      );
      frontLed.position.set(0, 0.006, -0.165);
      group.add(frontLed);
      const rearLed = new THREE.Mesh(
        new THREE.SphereGeometry(0.019, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 1.8 })
      );
      rearLed.position.set(0, 0.006, 0.165);
      group.add(rearLed);

      group.userData.props = props;
      return group;
    }

    const vehiclePivot = new THREE.Group();
    scene.add(vehiclePivot);

    const modelUpRef = new THREE.Vector3(0, 1, 0);
    const yawAxis = new THREE.Vector3(0, 1, 0);
    const tempUp = new THREE.Vector3();
    const orientQuat = new THREE.Quaternion();
    const currentQuat = new THREE.Quaternion();
    const displayEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    /* IMU frame -> Three.js model frame (PCB flat on desk):
     *   model X = IMU X,  model Y = IMU Z (up),  model Z = IMU Y */
    function imuToModelUp(ax, ay, az, out) {
      out.set(ax, az, ay);
      if (out.lengthSq() < 1) {
        return null;
      }
      out.normalize();
      return out;
    }

    function buildOrientationQuat(ax, ay, az, yaw, out) {
      const result = out || orientQuat;
      if (!imuToModelUp(ax, ay, az, tempUp)) {
        return null;
      }

      const tiltQuat = new THREE.Quaternion().setFromUnitVectors(modelUpRef, tempUp);
      result.copy(tiltQuat);

      if (yaw != null) {
        const yawQuat = new THREE.Quaternion().setFromAxisAngle(
          yawAxis,
          THREE.MathUtils.degToRad(-yaw)
        );
        result.premultiply(yawQuat);
      }
      return result;
    }

    function getTiltAngles(ax, ay, az) {
      if (!imuToModelUp(ax, ay, az, tempUp)) {
        return null;
      }
      const q = buildOrientationQuat(ax, ay, az, null);
      if (!q) {
        return null;
      }
      displayEuler.setFromQuaternion(q, 'YXZ');
      return {
        pitch: THREE.MathUtils.radToDeg(displayEuler.x),
        roll: THREE.MathUtils.radToDeg(displayEuler.z),
        tilt: THREE.MathUtils.radToDeg(Math.acos(Math.max(-1, Math.min(1, tempUp.y))))
      };
    }

    const rocketGroup = buildRocket();
    const quadGroup = buildQuadcopter();
    vehiclePivot.add(rocketGroup);
    vehiclePivot.add(quadGroup);

    let activeVehicle = 'rocket';
    let sceneTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    let targetAx = 0;
    let targetAy = 0;
    let targetAz = 8192;
    let targetYaw = 0;
    let hasTarget = false;
    let orientationReady = false;

    function setVehicle(type) {
      activeVehicle = type;
      rocketGroup.visible = type === 'rocket';
      quadGroup.visible = type === 'quad';

      const isQuad = type === 'quad';
      starfield.visible = !isQuad;
      earth.visible = !isQuad;
      groundShadow.visible = isQuad;
      earthShine.intensity = isQuad ? 0 : 0.4;
      ambientLight.intensity = isQuad ? 0.85 : 0.5;
      hemiLight.intensity = isQuad ? 0.55 : 0;
      fillLight.color.setHex(isQuad ? 0xffffff : 0x88aaff);
      fillLight.intensity = isQuad ? 0.45 : 0.35;
      // Keep the clear buffer transparent so the pure white CSS background
      // shows through untouched by ACES tone mapping.
      renderer.setClearColor(0x000000, 0);
      sceneContainer.classList.toggle('light', isQuad);

      if (isQuad) {
        camera.position.set(0.9, 2.3, 2.9);
        camera.lookAt(0, 0.05, 0);
      } else {
        camera.position.set(2.4, 1.8, 2.8);
        camera.lookAt(0, 0.15, 0);
      }
    }

    /* The quad viewport is always white; the rocket viewport follows the
     * page theme (space stays dark, light theme gets a pale sky). */
    function setSceneTheme(theme) {
      sceneTheme = theme === 'light' ? 'light' : 'dark';
      setVehicle(activeVehicle);
    }

    function updateAttitude(ax, ay, az, yaw) {
      if (ax == null || ay == null || az == null) {
        hasTarget = false;
        return;
      }
      targetAx = ax;
      targetAy = ay;
      targetAz = az;
      if (yaw != null) {
        targetYaw = yaw;
      }
      hasTarget = true;
    }

    function resize() {
      const w = sceneContainer.clientWidth;
      const h = sceneContainer.clientHeight;
      if (w === 0 || h === 0) {
        return;
      }
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    const rocketFlames = rocketGroup.userData.flames || [];
    const clock = new THREE.Clock();

    function animateSpace(time) {
      if (!earth.visible) {
        return;
      }
      earth.userData.surface.rotation.y = time * 0.012;
      earth.userData.clouds.rotation.y = time * 0.02;
      starfield.rotation.y = time * 0.004;
    }

    function animateProps(time) {
      if (!quadGroup.visible) {
        return;
      }
      const props = quadGroup.userData.props || [];
      for (let i = 0; i < props.length; i++) {
        const m = props[i];
        if (m.userData.prop) {
          m.userData.prop.rotation.y = time * 28 * (m.userData.spinDir || 1);
        }
      }
    }

    function animateFlames(time) {
      if (!rocketGroup.visible) {
        return;
      }
      const engineLight = rocketGroup.userData.engineLight;
      const halo = rocketGroup.userData.halo;
      if (engineLight) {
        engineLight.intensity = 1.4 + 0.5 * Math.abs(Math.sin(time * 19)) + 0.2 * Math.sin(time * 47);
      }
      if (halo) {
        halo.material.opacity = 0.07 + 0.05 * Math.abs(Math.sin(time * 23));
      }
      for (let i = 0; i < rocketFlames.length; i++) {
        const f = rocketFlames[i];
        const flicker = 0.82 + 0.18 * Math.sin(time * 22 + f.userData.phase)
          + 0.06 * Math.sin(time * 53 + f.userData.phase * 1.7);
        f.scale.y = flicker;
        f.scale.x = 0.94 + 0.1 * Math.sin(time * 30 + f.userData.phase);
        f.scale.z = f.scale.x;
        if (f.userData.outer) {
          f.userData.outer.material.opacity = 0.35 + 0.18 * (flicker - 0.82) / 0.18;
        }
        if (f.userData.inner) {
          f.userData.inner.material.opacity = 0.6 + 0.25 * Math.abs(Math.sin(time * 26 + f.userData.phase));
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      if (hasTarget) {
        const nextQuat = buildOrientationQuat(targetAx, targetAy, targetAz, targetYaw);
        if (nextQuat) {
          if (!orientationReady) {
            currentQuat.copy(nextQuat);
            orientationReady = true;
          } else {
            currentQuat.slerp(nextQuat, 0.18);
          }
          vehiclePivot.quaternion.copy(currentQuat);
        }
      }
      animateSpace(time);
      animateFlames(time);
      animateProps(time);
      renderer.render(scene, camera);
    }

    resize();
    animate();

    window.attitudeScene = { setVehicle, updateAttitude, getTiltAngles, resize, setTheme: setSceneTheme };
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(sceneContainer);

    try {
      let saved = localStorage.getItem('attitudeVehicle');
      if (saved === 'plane') {
        saved = 'rocket';
      }
      if (saved === 'quad' || saved === 'rocket') {
        if (typeof window.syncAttitudeVehicle === 'function') {
          window.syncAttitudeVehicle(saved);
        } else {
          setVehicle(saved);
        }
      } else {
        setVehicle('rocket');
      }
    } catch (_) {
      setVehicle('rocket');
    }
  </script>
</body>
</html>
