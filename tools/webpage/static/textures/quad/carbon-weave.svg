<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#1a1a1c"/>
      <rect x="0" y="0" width="8" height="8" fill="#222226"/>
      <rect x="8" y="8" width="8" height="8" fill="#222226"/>
      <rect x="0" y="0" width="8" height="8" fill="#2a2a30" opacity="0.35"/>
      <rect x="8" y="8" width="8" height="8" fill="#2a2a30" opacity="0.35"/>
      <path d="M0 8H16M8 0V16" stroke="#0e0e10" stroke-width="0.6"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#weave)"/>
  <rect width="256" height="256" filter="url(#noise)"/>
</svg>
